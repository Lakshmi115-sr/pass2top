function getExam(id){ const p=EXAM_POOLS[id]||EXAM_POOLS.maths; const order={"SECTION A":1,"SECTION B":2,"SECTION C":3,"SECTION D":4,"విభాగం A":1,"విభాగం B":2,"విభాగం C":3,"విభాగం D":4,"खंड A":1,"खंड B":2,"खंड C":3,"खंड D":4}; return [...p].sort(()=>Math.random()-0.5).slice(0,Math.min(p.length,6)).sort((a,b)=>(order[a.s]||5)-(order[b.s]||5)); }
function dlText(name,txt){ const b=new Blob([txt],{type:"text/plain"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }
function useLS(k,i){ const [v,sv]=useState(i); const set=x=>{sv(x);}; return[v,set]; }

function App(){
  const [student,setStudent]=useLS("p2t_s",null);
  const [tab,setTab]=useState("learn");
  const [page,setPage]=useState("home");
  const [selSub,setSelSub]=useState(null);
  const [examSub,setExamSub]=useState(null);
  const [examFrom,setExamFrom]=useState("home");
  const [toast,setToast]=useState("");
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(""),2500);};

  if(!student) return <Login onLogin={s=>{setStudent(s);}}/>;

  const subFound=SUBJECTS.find(s=>s.id===selSub)||SUBJECTS[0];
  const examSubFound=SUBJECTS.find(s=>s.id===examSub)||SUBJECTS[0];

  if(page==="subject") return <SubjectPage sub={subFound} onBack={()=>setPage("home")} onExam={()=>{setExamSub(selSub);setExamFrom("subject");setPage("exam");}} showToast={showToast}/>;
  if(page==="exam") return <ExamPage sub={examSubFound} onBack={()=>{if(examFrom==="subject"){setPage("subject");}else{setPage("home");}}} showToast={showToast}/>;

  return (<>
    <style>{CSS}</style>
    {toast&&<div className="toast">{toast}</div>}
    <div className="app">
      {tab==="learn"&&<LearnTab onSub={id=>{setSelSub(id);setPage("subject");}} student={student}/>}
      {tab==="base"&&<BaseTab onSub={id=>{setSelSub(id);setPage("subject");}}/>}
      {tab==="edge"&&<EdgeTab/>}
      {tab==="exam"&&<ExamPickTab onExam={id=>{setExamSub(id);setExamFrom("home");setPage("exam");}}/>}
      <nav className="nav">
        {[{id:"learn",icon:"📚",lbl:"LEARN"},{id:"base",icon:"🏗️",lbl:"BASE"},{id:"edge",icon:"⚔️",lbl:"EDGE"},{id:"exam",icon:"📝",lbl:"EXAM"}]
          .map(n=><button key={n.id} className={`nav-btn${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}><span className="nav-icon">{n.icon}</span><span className="nav-lbl">{n.lbl}</span></button>)}
      </nav>
    </div>
  </>);
}

// ── EXAM PAGE ─────────────────────────────────────────────────────────────────
function ExamPage({sub,onBack,showToast}){
  const [questions]=useState(()=>getExam(sub.id));
  const [stage,setStage]=useState("paper");
  const [uploaded,setUploaded]=useState(null);
  const [evalResult,setEvalResult]=useState("");
  const [evalLoading,setEvalLoading]=useState(false);
  const fileRef=useRef(null);

  const dlPaper=()=>{
    let txt=`TELANGANA STATE BOARD SSC 2026\nSubject: ${sub.name.toUpperCase()}\nTime: 2 hr 45 min  Max Marks: ${questions.reduce((a,q)=>a+q.m,0)}\n${"═".repeat(50)}\n\n`;
    let lastSec="";
    questions.forEach((q,i)=>{
      if(q.s!==lastSec){lastSec=q.s;txt+=`\n${q.s}\n${"─".repeat(30)}\n`;}
      txt+=`${i+1}. ${q.q}  [${q.m}M]\n\n`;
    });
    txt+=`\n${"═".repeat(50)}\n*** All the Best! Pass2Top ***`;
    dlText(`TS_SSC_${sub.name}_Exam.txt`,txt);
    showToast("✅ Question paper downloaded!");
  };

  const handleUpload=e=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{setUploaded({b64:ev.target.result.split(",")[1],name:file.name});setStage("upload");showToast("📸 Uploaded!");};
    reader.readAsDataURL(file);
  };

  const evaluate=async()=>{
    setEvalLoading(true);
    try{
      const qList=questions.map((q,i)=>`Q${i+1}(${q.m}M): ${q.q}`).join("\n");
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:"image/jpeg",data:uploaded.b64}},
            {type:"text",text:`You are a TS SSC 2026 examiner for ${sub.name}.\nQuestions:\n${qList}\n\nEvaluate the handwritten answers in the image. Give:\n1. Score for each question (X/Y marks)\n2. Total score\n3. What was good ✅\n4. What was missing ❌\n5. Encouraging message\n\nBe fair and encouraging like a TS Board teacher!`}
          ]}]})
      });
      const d=await resp.json();
      setEvalResult(d.content?.[0]?.text||"Could not evaluate. Please try again.");
      setStage("result");
    }catch(e){setEvalResult("⚠️ "+e.message);setStage("result");}
    setEvalLoading(false);
  };

  return (<>
    <style>{CSS}</style>
    <div className="app">
      <div className="ph" style={{background:`linear-gradient(135deg,${sub.color}22,${sub.color}44)`}}>
        <div className="ph-row">
          <button className="back" onClick={onBack}>←</button>
          <div>
            <div className="ph-title">{sub.icon} {sub.name} — Exam</div>
            <div className="ph-sub">Write on paper → Upload photo → Get AI evaluation</div>
          </div>
        </div>
      </div>
      <div className="pad" style={{paddingTop:14,paddingBottom:90}}>

        {stage==="paper"&&<>
          <button onClick={dlPaper} style={{width:"100%",background:"linear-gradient(135deg,#27AE6020,#27AE6040)",border:"1.5px solid #27AE6060",borderRadius:12,padding:"13px",color:"#2ECC71",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"'Poppins',sans-serif",marginBottom:10}}>⬇️ Download Question Paper</button>
          <div className="box box-yellow">📝 Read questions → Write answers on paper with pen → Take clear photo → Upload for AI evaluation!</div>
          <div style={{background:"#ffffff06",border:`1px solid ${sub.color}30`,borderRadius:16,padding:16,marginBottom:14}}>
            <div style={{textAlign:"center",marginBottom:14,borderBottom:`1px solid ${sub.color}30`,paddingBottom:12}}>
              <div style={{fontFamily:"'Baloo 2',cursive",fontSize:15,fontWeight:900,color:sub.color}}>TELANGANA STATE BOARD SSC 2026</div>
              <div style={{fontSize:13,fontWeight:700,marginTop:3}}>{sub.name.toUpperCase()}</div>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>Time: 2hr 45min · Max: {questions.reduce((a,q)=>a+q.m,0)} Marks</div>
            </div>
            {(()=>{let ls="";return questions.map((q,i)=>{const ss=q.s!==ls;ls=q.s;return <div key={i}>{ss&&<div style={{fontSize:11,fontWeight:800,color:sub.color,letterSpacing:1,marginTop:12,marginBottom:8,textTransform:"uppercase"}}>{q.s} · {q.m} Mark{q.m>1?"s":""} each</div>}<div style={{display:"flex",gap:10,marginBottom:12,alignItems:"flex-start"}}><span style={{fontWeight:800,color:sub.color,fontSize:13,minWidth:22}}>{i+1}.</span><div style={{fontSize:13,fontWeight:600,flex:1,lineHeight:1.6}}>{q.q}</div><span className="badge b-orange" style={{flexShrink:0,alignSelf:"flex-start"}}>{q.m}M</span></div></div>;});})()}
          </div>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handleUpload}/>
          <button className="btn btn-orange" onClick={()=>fileRef.current?.click()}>📷 Upload Answer Paper (Camera)</button>
          <button className="btn btn-ghost" style={{fontSize:12}} onClick={()=>{fileRef.current?.removeAttribute("capture");fileRef.current?.click();}}>🖼️ Choose from Gallery</button>
        </>}

        {stage==="upload"&&<>
          <div className="box box-green">✅ Uploaded: <strong>{uploaded?.name}</strong></div>
          <div style={{borderRadius:14,overflow:"hidden",marginBottom:14,border:`1px solid ${sub.color}40`}}>
            <img src={`data:image/jpeg;base64,${uploaded?.b64}`} alt="Answer paper" style={{width:"100%",display:"block"}}/>
          </div>
          <button className="btn btn-orange" onClick={evaluate} disabled={evalLoading}>
            {evalLoading?"⏳ AI is evaluating your answers...":"🤖 Evaluate My Answers"}
          </button>
          {evalLoading&&<div className="typing" style={{justifyContent:"center",marginBottom:12}}><div className="dot"/><div className="dot"/><div className="dot"/></div>}
          <button className="btn btn-ghost" onClick={()=>{setUploaded(null);setStage("paper");}}>← Re-upload</button>
        </>}

        {stage==="result"&&<>
          <div style={{background:`linear-gradient(135deg,${sub.color}15,#060818)`,border:`1.5px solid ${sub.color}40`,borderRadius:16,padding:16,marginBottom:14}}>
            <div style={{fontFamily:"'Baloo 2',cursive",fontSize:16,fontWeight:900,color:sub.color,marginBottom:12}}>📊 AI Evaluation Result</div>
            <div className="ai-eval" style={{background:"transparent",border:"none",padding:0}}>{evalResult}</div>
          </div>
          <button className="btn btn-orange" onClick={()=>{setUploaded(null);setEvalResult("");setStage("paper");}}>🔄 Try New Exam</button>
          <button className="btn btn-ghost" onClick={onBack}>← Back to Study</button>
        </>}
      </div>
    </div>
  </>);
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);

    // Register Service Worker
    if('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW failed:', err));
      });
    }
  </script>
</body>
